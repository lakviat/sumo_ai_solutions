name: Search discovery

on:
  pull_request:
  push:
    branches: [main]
  page_build:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.build.commit || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check site and search discovery
        run: |
          node --check script.js
          node --check scripts/submit-indexnow.cjs
          node --test tests/*.test.cjs
      - name: Notify IndexNow after deployment
        if: >-
          github.repository == 'lakviat/sumo_ai_solutions' &&
          (github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'page_build' && github.event.build.status == 'built'))
        run: node scripts/submit-indexnow.cjs
